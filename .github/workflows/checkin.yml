name: A自动签到

on:
  schedule:
    - cron: '15 16 * * *'
    - cron: '0 22 * * *'
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '忽略"今日已签"记录，强制签到'
        type: boolean
        default: false
      proxy_mode:
        description: '通道模式'
        type: choice
        default: auto
        options:
          - auto
          - direct
          - proxy

permissions:
  contents: write

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
    - uses: actions/checkout@v5
      with:
          fetch-depth: 0

    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Check permissions
      continue-on-error: true
      run: |
        gh workflow enable sync.yml >/dev/null 2>&1 || true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 随机延迟
      run: sleep $((RANDOM % 120))

    - name: 运行签到
      env:
        ACCOUNTS: ${{ secrets.ACCOUNTS }}
        MT_PROXY_MODE: ${{ github.event.inputs.proxy_mode || 'auto' }}
        MT_FORCE: ${{ github.event.inputs.force && '1' || '0' }}
      run: python main.py

    - name: Empty commit
      if: always()
      run: |
        git config user.name "github-actions" >/dev/null 2>&1
        git config user.email "github-actions@github.com" >/dev/null 2>&1
        git commit --allow-empty -m "chore: keepalive" >/dev/null 2>&1
        git pull --quiet --rebase origin main >/dev/null 2>&1
        git push --quiet origin main >/dev/null 2>&1
